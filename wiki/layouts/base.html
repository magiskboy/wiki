<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="{{ page.description | default(site.description) }}">
  <script>
    (function () {
      try {
        var THEMES = ["light", "dark", "paper"];
        var saved = localStorage.getItem("my-brain-theme");
        var theme = (saved && THEMES.indexOf(saved) !== -1)
          ? saved
          : (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {}
    })();
  </script>
  <title>{% block title %}{{ page.title }} · {{ site.title }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  {% block head_extra %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#content">Tới nội dung</a>
  <header class="site-header">
    <a class="site-brand" href="/">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Điều hướng">
      <a href="/">Mục lục</a>
      <a href="/graph/">Đồ thị</a>
      <a href="/categories/">Category</a>
      <a href="/tags/">Tags</a>
    </nav>
    <div class="theme-switcher" role="group" aria-label="Chọn giao diện">
      <button type="button" data-theme-btn="light" aria-pressed="false">Sáng</button>
      <button type="button" data-theme-btn="dark" aria-pressed="false">Tối</button>
      <button type="button" data-theme-btn="paper" aria-pressed="false">Giấy</button>
    </div>
  </header>
  <main class="site-main{% block main_class %}{% endblock %}" id="content">
    {% block main %}
    <article class="article">
{{ content }}
    </article>
    {% endblock %}
  </main>
  <footer class="site-footer">
    <p>Đọc tĩnh từ wiki — không theo dõi, không cookie.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js" defer></script>
  <script src="/assets/app.js" defer></script>
  {% if page.math %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
    onload="renderMathInElement(document.body, {delimiters: [{left: '\\[', right: '\\]', display: true}, {left: '\\(', right: '\\)', display: false}], throwOnError: false});"></script>
  {% endif %}
  {% block scripts %}{% endblock %}
</body>
</html>
