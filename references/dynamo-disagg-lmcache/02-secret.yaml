# Hugging Face token for gated models. Replace before applying.
# kubectl create secret generic hf-token-secret --from-literal=HF_TOKEN=<token> -n ai-dept-serving --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: hf-token-secret
  namespace: ai-dept-serving
  labels:
    app.kubernetes.io/part-of: vllm-lmcache-single-node
type: Opaque
stringData:
  HF_TOKEN: ""
